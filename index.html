<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Baby Shower</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Agregar Google Font para estilo carta -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Audio con reproducción automática y oculto -->
  <audio id="background-music" autoplay loop hidden>
    <source src="./media/music.mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <!-- Bloque 1: Intro con frasco -->
  <section class="block" id="block-intro">
    <div class="instruction-container">
      <p class="instruction-text">Toca la miel para ver la invitación</p>
      <div class="arrows">
        <div class="arrow">➤</div>
        <div class="arrow">➤</div>
        <div class="arrow">➤</div>
      </div>
    </div>
    <div class="jar-container">
      <img id="jar-body" src="./media/hunnySVG_BOULD.svg" alt="Frasco de miel" decoding="async" loading="eager">
      <img id="jar-lid" src="./media/hunnySVG_TAPA.svg" alt="Tapa del frasco">
    </div>
  </section>

  <!-- Bloque 2: Invitación con cuenta regresiva y ubicación -->
  <section class="block hidden" id="block-invitation">
    <!-- Cuenta regresiva -->
    <div class="countdown-container">
      <div class="countdown">
        <div class="time-unit">
          <div class="time-value" id="days">00</div>
          <div class="time-label">Días</div>
        </div>
        <div class="separator">:</div>
        <div class="time-unit">
          <div class="time-value" id="hours">00</div>
          <div class="time-label">Horas</div>
        </div>
        <div class="separator">:</div>
        <div class="time-unit">
          <div class="time-value" id="minutes">00</div>
          <div class="time-label">Minutos</div>
        </div>
        <div class="separator">:</div>
        <div class="time-unit">
          <div class="time-value" id="seconds">00</div>
          <div class="time-label">Segundos</div>
        </div>
      </div>
    </div>

    <!-- Imagen de invitación -->
    <img src="./media/prueba_abre.gif" alt="Invitación" class="invitation-img">

    <!-- Botón de ubicación -->
    <div class="location-container">
      <button class="location-button" onclick="window.open('https://www.google.com/maps/place/Doroteo+Arango+103,+Zona+A,+La+Toma+de+Zacatecas,+98057+Zacatecas,+Zac./@22.7700169,-102.6009082,18.26z/data=!4m6!3m5!1s0x86824e12d20c993d:0xa957f2f74a5da939!8m2!3d22.7702298!4d-102.5996413!16s%2Fg%2F11c5nzw3bh?entry=ttu&g_ep=EgoyMDI1MDgzMC4wIKXMDSoASAFQAw%3D%3D', '_blank')">
        📍 Click para ver la ubicación
      </button>
    </div>
  </section>

  <section class="block hidden" id="block-extra">
    <p>Aquí puedes poner más cosas después (texto, botones, música, etc.)</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
