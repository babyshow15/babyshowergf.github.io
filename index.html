<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Baby Shower</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Bloque 1: Intro con frasco -->
  <section class="block" id="block-intro">
    <div class="jar-container">
      <img id="jar-body" src="media/hunnySVG_BOULD.svg" alt="Frasco">
      <img id="jar-lid" src="media/hunnySVG_TAPA.svg" alt="Tapa">
    </div>
  </section>

  <!-- Bloque 2: Invitación -->
  <section class="block hidden" id="block-invitation">
    <img src="media/prueba_abre.svg" alt="Invitación" class="invitation-img">
  </section>

  <!-- Bloque 3: Espacio para futuros elementos -->
  <section class="block" id="block-extra">
    <p>Aquí puedes poner más cosas después (texto, botones, música, etc.)</p>
  </section>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
