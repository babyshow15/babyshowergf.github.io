<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Baby Shower</title>
  <style>
    /* Fondo degradado pastel con prefijos para navegadores */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #fff9c4; /* Fallback para navegadores que no soportan degradado */
      background: -webkit-linear-gradient(top, #fff9c4, #bbdefb); /* Chrome 10-25, Safari 5.1-6 */
      background: linear-gradient(to bottom, #fff9c4, #bbdefb); /* Standard syntax */
      -webkit-font-smoothing: antialiased; /* Mejora el renderizado de texto en Chrome */
      -moz-osx-font-smoothing: grayscale; /* Mejora el renderizado en Firefox */
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Bloques de la página */
    .block {
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      text-align: center;
      padding: 20px;
    }

    /* Contenedor del frasco */
    .jar-container {
      position: relative;
      width: 70vw;       /* ancho relativo para móviles */
      max-width: 320px;  /* límite en pantallas grandes */
      margin: auto;
      -webkit-perspective: 1000px; /* Mejora renderizado 3D en Chrome/Safari */
      perspective: 1000px;
    }

    #jar-body {
      width: 100%;
      height: auto;
      display: block;
      -webkit-backface-visibility: hidden; /* Previene parpadeo en Chrome */
      backface-visibility: hidden;
      -webkit-transform: translateZ(0); /* Acelera el renderizado en Chrome */
      transform: translateZ(0);
      image-rendering: -webkit-optimize-contrast; /* Mejora calidad de imagen en Chrome */
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.2));
    }

    #jar-lid {
      position: absolute;
      top: -8%;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      width: 90%;
      height: auto;
      cursor: pointer;
      z-index: 2;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      -webkit-transform: translateX(-50%) translateZ(0);
      transform: translateX(-50%) translateZ(0);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 5px 8px rgba(0, 0, 0, 0.3));
      transition: transform 0.3s ease;
    }

    #jar-lid:hover {
      transform: translateX(-50%) translateY(-2px);
    }

    /* Indicador de interacción */
    .click-hint {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      color: #7e57c2;
      font-weight: bold;
      text-shadow: 1px 1px 2px white;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* Loader para mientras carga */
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #ffccbc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 5;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Imagen de la invitación */
    .invitation-img {
      max-width: 90%;
      max-height: 90vh;
      height: auto;
      display: block;
      margin: auto;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Ocultar bloques */
    .hidden {
      display: none !important;
    }

    /* Media queries para diferentes dispositivos */
    @media (max-width: 768px) {
      .jar-container {
        width: 85vw;
      }
    }

    @media (max-width: 480px) {
      .jar-container {
        width: 95vw;
      }
      
      #jar-lid {
        top: -5%;
      }
      
      .click-hint {
        font-size: 14px;
        bottom: -30px;
      }
    }
  </style>
</head>
<body>
  <!-- Bloque 1: Intro con frasco -->
  <section class="block" id="block-intro">
    <div class="jar-container">
      <div class="loader" id="loader"></div>
      <img id="jar-body" src="https://svgshare.com/i/151x.svg" alt="Frasco de miel">
      <img id="jar-lid" src="https://svgshare.com/i/151f.svg" alt="Tapa del frasco">
      <div class="click-hint">¡Haz clic en la tapa para abrir!</div>
    </div>
  </section>

  <!-- Bloque 2: Invitación -->
  <section class="block hidden" id="block-invitation">
    <img src="https://svgshare.com/i/1515.svg" alt="Invitación" class="invitation-img">
  </section>

  <!-- Bloque 3: Espacio para futuros elementos -->
  <section class="block hidden" id="block-extra">
    <p>Aquí puedes poner más cosas después (texto, botones, música, etc.)</p>
  </section>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const jarLid = document.getElementById('jar-lid');
      const jarBody = document.getElementById('jar-body');
      const blockIntro = document.getElementById('block-intro');
      const blockInvitation = document.getElementById('block-invitation');
      const loader = document.getElementById('loader');
      
      // Ocultar loader cuando las imágenes se carguen
      const images = document.querySelectorAll('img');
      let loadedImages = 0;
      
      images.forEach(img => {
        if (img.complete) {
          imageLoaded();
        } else {
          img.addEventListener('load', imageLoaded);
          img.addEventListener('error', imageLoaded); // También manejar errores
        }
      });
      
      function imageLoaded() {
        loadedImages++;
        if (loadedImages >= images.length) {
          // Todas las imágenes cargadas, ocultar loader
          loader.style.display = 'none';
          
          // Forzar repintado para Chrome
          setTimeout(forceRepaint, 100);
        }
      }
      
      function forceRepaint() {
        // Técnica para forzar repintado en Chrome
        jarBody.style.display = 'none';
        jarBody.offsetHeight; // Trigger reflow
        jarBody.style.display = 'block';
        
        jarLid.style.display = 'none';
        jarLid.offsetHeight; // Trigger reflow
        jarLid.style.display = 'block';
      }
      
      // Forzar repintado inicial después de un breve delay
      setTimeout(forceRepaint, 300);
      
      jarLid.addEventListener('click', () => {
        // Mejorar rendimiento preparando elementos para animación
        jarLid.style.willChange = 'transform';
        jarBody.style.willChange = 'transform, opacity';
        
        // Animar tapa hacia arriba
        gsap.to(jarLid, {
          y: -200,
          duration: 1.2,
          ease: "power2.out",
          onComplete: () => {
            jarLid.style.willChange = 'auto';
          }
        });

        // Animar frasco hacia abajo y desvanecer
        gsap.to(jarBody, {
          y: 200,
          opacity: 0,
          duration: 1.5,
          ease: "power2.in",
          onComplete: () => {
            jarBody.style.willChange = 'auto';
            // Ocultar bloque 1
            blockIntro.classList.add('hidden');
            // Mostrar bloque 2 (invitación)
            blockInvitation.classList.remove('hidden');
            gsap.fromTo(blockInvitation, 
              { opacity: 0, y: 20 }, 
              { opacity: 1, y: 0, duration: 1.2 }
            );
          }
        });
      });
      
      // Detectar Chrome específicamente para aplicar mejoras adicionales
      const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
      if (isChrome) {
        document.body.classList.add('chrome-browser');
        // Aplicar estilos específicos para Chrome si es necesario
      }
    });
  </script>
</body>
</html>
